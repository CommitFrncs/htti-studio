# ═══════════════════════════════════════════════════════════
# netlify.toml — Netlify deployment config for HTTI Studio frontend
# ═══════════════════════════════════════════════════════════

[build]
  # The directory to publish (your frontend files)
  publish = "client"
  # No build command needed — it's plain HTML/CSS/JS

# Redirect all routes to index.html (SPA behaviour)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://www.gstatic.com https://apis.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.onrender.com https://*.railway.app;
      img-src 'self' data: https://hcti.io https://*.hcti.io blob:;
      frame-src https://accounts.google.com;
    """

# Cache static assets aggressively
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Don't cache HTML (so updates deploy immediately)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Service worker must not be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
